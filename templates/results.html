 <!DOCTYPE html>
<html>
<head>
    <title>Fashion Recommendations</title>
</head>
<body>

    <h1>Uploaded Image</h1>

    <img src="/uploads/{{ uploaded_image }}"
         width="250"
         style="margin-bottom:20px;">

    <hr>

    <h1>Recommended Images</h1>

    {% for image in results %}
        <img src="/{{ image.replace('\\', '/') }}"
             width="200"
             style="margin:10px;">
    {% endfor %}

    <br><br>

    <a href="/">Search Again</a>

</body>
</html>
